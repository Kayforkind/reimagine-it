<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Texas notebook — SVG</title>
<style>
  :root { --paper:#f4ecd8; --ink:#1a2138; --hot:#b22234; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { padding: 0; }
  a:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }
  ::selection { background: #e8a63f; color: #1a2138; }
  object { display: block; width: 100%; height: 100vh; border: 0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; } }
</style>
</head>
<body data-ready="1">
  <object type="image/svg+xml" data="after.svg" aria-label="A Texas notebook redrawn as one SVG"></object>
</body>
</html>
