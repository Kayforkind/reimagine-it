<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"
     aria-labelledby="title desc">
  <title id="title">A Texas notebook, as one SVG</title>
  <desc id="desc">Lone Star flag as the weenie, schematic Texas with three unlabeled pins, eight equal acre units, and a common-scale timeline 1836 to 1995. Labels live in the legend gutter. The mark is alive: star breathe, river flow, Alamo pin ping, 1839 tick hush; hover pairs pin to legend. No invented numbers.</desc>
  <style>
    .star { transform-origin: 80px 168px; animation: breathe 2.8s ease-in-out infinite; }
    .river { stroke-dasharray: 10 12; animation: flow 7s linear infinite; }
    .pin { transform-box: fill-box; transform-origin: center; }
    .pin-alamo { animation: ping 2.6s ease-in-out infinite; }
    .tick-quiet { animation: hush 3.2s ease-in-out infinite; }
    .swatch { transform-box: fill-box; transform-origin: center; transition: transform 160ms ease-out; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes flow { to { stroke-dashoffset: -88; } }
    @keyframes ping { 0%,100% { transform: scale(1); } 50% { transform: scale(1.22); } }
    @keyframes hush { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .pin:hover,
    svg:has(.row-alamo:hover) .pin-alamo,
    svg:has(.row-austin:hover) .pin-austin,
    svg:has(.row-bend:hover) .pin-bend {
      animation: none;
      transform: scale(1.32);
    }
    svg:has(.pin-alamo:hover) .row-alamo .swatch,
    svg:has(.pin-austin:hover) .row-austin .swatch,
    svg:has(.pin-bend:hover) .row-bend .swatch { transform: scale(1.25); }
    .star:hover { animation: none; transform: scale(1.08); }
    @media (prefers-reduced-motion: reduce) {
      .star, .river, .pin-alamo, .tick-quiet { animation: none; }
      .swatch { transition-duration: 0.001ms; }
    }
    svg.is-still .star, svg.is-still .river, svg.is-still .pin-alamo, svg.is-still .tick-quiet {
      animation: none;
    }
  </style>

  <rect width="1600" height="900" fill="#f4ecd8"/>
  <rect x="40" y="40" width="1520" height="820" fill="none" stroke="#1a2138" stroke-width="1.5"/>

  <!-- Title band &#183; type only, empty of marks -->
  <text x="64" y="88" fill="#1a2138" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="36">A Texas notebook</text>
  <text x="1188" y="82" fill="#6a624e" font-family="Georgia, serif" font-size="15" font-style="italic">the state, the flag, and the people</text>

  <!-- Weenie: real Lone Star flag geometry, no type on the cloth -->
  <g transform="translate(64,118)" aria-hidden="true">
    <rect width="160" height="320" fill="#1a2138"/>
    <rect x="160" width="320" height="160" fill="#f4ecd8"/>
    <rect x="160" y="160" width="320" height="160" fill="#b22234"/>
    <g class="star">
      <path fill="#e8a63f" d="M80,118 L92,156 L132,156 L100,180 L112,218 L80,194 L48,218 L60,180 L28,156 L68,156 Z"/>
    </g>
  </g>

  <!-- ISOTYPE: eight equal units, no caption on the row -->
  <g transform="translate(64,468)" aria-hidden="true">
    <g fill="#2c3a5a" stroke="none">
      <g transform="translate(0,0)"><path d="M6 52 L16 28 L26 38 L34 18 L46 34 L58 14 L64 52 Z"/><path d="M6 54 Q35 46 64 54" fill="none" stroke="#e8a63f" stroke-width="2.2"/></g>
      <g transform="translate(72,0)"><path d="M6 52 L16 28 L26 38 L34 18 L46 34 L58 14 L64 52 Z"/><path d="M6 54 Q35 46 64 54" fill="none" stroke="#e8a63f" stroke-width="2.2"/></g>
      <g transform="translate(144,0)"><path d="M6 52 L16 28 L26 38 L34 18 L46 34 L58 14 L64 52 Z"/><path d="M6 54 Q35 46 64 54" fill="none" stroke="#e8a63f" stroke-width="2.2"/></g>
      <g transform="translate(216,0)"><path d="M6 52 L16 28 L26 38 L34 18 L46 34 L58 14 L64 52 Z"/><path d="M6 54 Q35 46 64 54" fill="none" stroke="#e8a63f" stroke-width="2.2"/></g>
      <g transform="translate(288,0)"><path d="M6 52 L16 28 L26 38 L34 18 L46 34 L58 14 L64 52 Z"/><path d="M6 54 Q35 46 64 54" fill="none" stroke="#e8a63f" stroke-width="2.2"/></g>
      <g transform="translate(360,0)"><path d="M6 52 L16 28 L26 38 L34 18 L46 34 L58 14 L64 52 Z"/><path d="M6 54 Q35 46 64 54" fill="none" stroke="#e8a63f" stroke-width="2.2"/></g>
      <g transform="translate(432,0)"><path d="M6 52 L16 28 L26 38 L34 18 L46 34 L58 14 L64 52 Z"/><path d="M6 54 Q35 46 64 54" fill="none" stroke="#e8a63f" stroke-width="2.2"/></g>
      <g transform="translate(504,0)"><path d="M6 52 L16 28 L26 38 L34 18 L46 34 L58 14 L64 52 Z"/><path d="M6 54 Q35 46 64 54" fill="none" stroke="#e8a63f" stroke-width="2.2"/></g>
    </g>
  </g>

  <!-- Schematic Texas: pins only. Labels are in the gutter. -->
  <g transform="translate(580,130)" aria-hidden="true">
    <path d="M78 40 H 198 V 124 H 438 L 486 196 L 474 258 L 428 304 L 368 352 L 286 408 L 210 428 L 142 408 L 96 368 L 70 312 L 58 248 L 66 176 L 78 124 Z"
          fill="#efe4c8" stroke="#1a2138" stroke-width="2.5"/>
    <path class="river" d="M96 368 C 150 396, 220 420, 286 408" fill="none" stroke="#e8a63f" stroke-width="4"/>
    <circle class="pin pin-bend" cx="118" cy="352" r="11" fill="#b22234" stroke="#f4ecd8" stroke-width="2"/>
    <circle class="pin pin-alamo" cx="252" cy="328" r="11" fill="#e8a63f" stroke="#1a2138" stroke-width="2"/>
    <circle class="pin pin-austin" cx="292" cy="268" r="11" fill="#1a2138" stroke="#f4ecd8" stroke-width="2"/>
  </g>

  <!-- Gutter legend: every name lives here -->
  <g transform="translate(1188,130)" font-family="Georgia, serif">
    <text y="0" fill="#6a624e" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2.6">PLACES</text>
    <g class="row-alamo" transform="translate(0,28)">
      <circle class="swatch" cx="8" cy="10" r="8" fill="#e8a63f"/>
      <text x="28" y="14" fill="#1a2138" font-size="18">Alamo</text>
      <text x="28" y="36" fill="#6a624e" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">1836 &#183; San Antonio &#183; 19-day siege</text>
    </g>
    <g class="row-austin" transform="translate(0,78)">
      <circle class="swatch" cx="8" cy="10" r="8" fill="#1a2138"/>
      <text x="28" y="14" fill="#1a2138" font-size="18">Austin</text>
      <text x="28" y="36" fill="#6a624e" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">1839 &#183; on the Colorado</text>
    </g>
    <g class="row-bend" transform="translate(0,128)">
      <circle class="swatch" cx="8" cy="10" r="8" fill="#b22234"/>
      <text x="28" y="14" fill="#1a2138" font-size="18">Big Bend</text>
      <text x="28" y="36" fill="#6a624e" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">1944 &#183; 800,000 acres &#183; eight units</text>
    </g>

    <text y="210" fill="#6a624e" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="2.6">SIGNALS</text>
    <g transform="translate(0,238)">
      <path fill="#e8a63f" d="M8 2 L9.6 6.6 L14.4 6.6 L10.6 9.4 L12 14 L8 11.2 L4 14 L5.4 9.4 L1.6 6.6 L6.4 6.6 Z"/>
      <text x="28" y="14" fill="#1a2138" font-size="18">Lone Star flag</text>
      <text x="28" y="36" fill="#6a624e" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">1839 &#183; loyalty &#183; purity &#183; bravery</text>
    </g>
    <g transform="translate(0,288)">
      <path d="M8 28 C2 16, 4 8, 8 4 C12 8, 14 16, 8 28 Z" fill="#2c3a5a"/>
      <circle cx="8" cy="6" r="3.5" fill="#e8a63f"/>
      <text x="28" y="14" fill="#1a2138" font-size="18">Bluebonnet</text>
      <text x="28" y="36" fill="#6a624e" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">1901 &#183; blooms in spring</text>
    </g>
    <g transform="translate(0,338)">
      <path d="M0 12 Q8 0 16 12 Q8 6 0 12" fill="none" stroke="#1a2138" stroke-width="2"/>
      <text x="28" y="14" fill="#1a2138" font-size="18">Longhorn</text>
      <text x="28" y="36" fill="#6a624e" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">1995 &#183; 7 ft tip to tip</text>
    </g>
  </g>

  <!-- Timeline: four labeled years. 1839 is the small gold tick &#183; named in the gutter. -->
  <g transform="translate(64,700)" aria-hidden="true">
    <line x1="0" y1="36" x2="1472" y2="36" stroke="#1a2138" stroke-width="2"/>
    <g font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13" fill="#1a2138">
      <g transform="translate(0,36)">
        <line y1="-10" y2="10" stroke="#1a2138" stroke-width="2"/>
        <text y="-18">1836</text>
        <text y="32" font-family="Georgia, serif" font-size="16">Alamo</text>
      </g>
      <g class="tick-quiet" transform="translate(28,36)">
        <line y1="-6" y2="6" stroke="#e8a63f" stroke-width="2"/>
      </g>
      <g transform="translate(602,36)">
        <line y1="-10" y2="10" stroke="#1a2138" stroke-width="2"/>
        <text y="-18">1901</text>
        <text y="32" font-family="Georgia, serif" font-size="16">Bluebonnet</text>
      </g>
      <g transform="translate(1000,36)">
        <line y1="-10" y2="10" stroke="#b22234" stroke-width="2"/>
        <text y="-18">1944</text>
        <text y="32" font-family="Georgia, serif" font-size="16">Big Bend</text>
      </g>
      <g transform="translate(1472,36)">
        <line y1="-10" y2="10" stroke="#1a2138" stroke-width="2"/>
        <text y="-18" text-anchor="end">1995</text>
        <text y="32" text-anchor="end" font-family="Georgia, serif" font-size="16">Longhorn</text>
      </g>
    </g>
  </g>

  <text x="64" y="838" fill="#6a624e" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">Now: rereading J. Frank Dobie. Watching the mockingbird nest under the eave.</text>
  <text x="1536" y="838" text-anchor="end" fill="#1a2138" font-family="ui-monospace, Consolas, monospace" font-size="12">notes@texasnote.example</text>
  <script type="text/ecmascript"><![CDATA[
    if (/\bstill\b/.test(String(location.search))) {
      document.documentElement.classList.add("is-still");
    }
  ]]></script>
</svg>
