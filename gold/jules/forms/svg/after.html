<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jules Ice Cream — SVG</title>
<style>
  :root { --paper:#f7efe4; --ink:#3a2418; --berry:#c45c6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--berry); outline-offset: 3px; }
  ::selection { background: #e4b15a; color: #3a2418; }
  object { display: block; width: 100%; height: 100vh; border: 0; }
</style>
</head>
<body>
  <object type="image/svg+xml" data="after.svg" aria-label="Jules Ice Cream redrawn as one SVG"></object>
</body>
</html>
