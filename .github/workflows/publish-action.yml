name: Publish Design Health Action

# GitHub automatically discovers action.yml at the repo root on every
# tagged release and lists it in the GitHub Actions marketplace.
# This workflow validates the action and updates the release notes
# with marketplace metadata.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate and document"
        required: false
        default: "v2.3.2"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate action.yml
        run: |
          echo "::group::Validating action.yml"
          python -m pip install --quiet pyyaml
          python - <<'PYEOF'
          import yaml, sys

          with open('action.yml') as f:
              action = yaml.safe_load(f)

          required = ['name', 'description', 'runs']
          missing = [k for k in required if k not in action]
          if missing:
              print('ERROR: Missing required fields:', missing)
              sys.exit(1)

          print('Action name:', action['name'])
          print('Description:', action['description'])
          print('Author:', action.get('author', '(not set)'))
          print('Inputs:', list(action.get('inputs', {}).keys()))
          print('Outputs:', list(action.get('outputs', {}).keys()))
          print('action.yml is valid')
          PYEOF
          echo "::endgroup::"

      - name: Verify audit tool runs
        run: |
          echo "::group::Smoke-testing audit tool"
          set +e
          python scripts/audit_all.py --json > /dev/null 2>&1
          EXIT=$?
          set -e
          echo "audit_all.py exit code: $EXIT (0=clean, 1=warnings only)"
          if [ "$EXIT" -ge 2 ]; then
            echo "::error::audit_all.py returned exit code $EXIT (failures present)"
            exit 1
          fi
          echo "::endgroup::"

      - name: Verify CLI works
        run: |
          echo "::group::Smoke-testing CLI"
          node bin/reimagine-it.js --help > /dev/null 2>&1 || {
            echo "::error::CLI --help failed"
            exit 1
          }
          echo "CLI --help: OK"

          node bin/reimagine-it.js --version 2>&1 || {
            echo "::error::CLI --version failed"
            exit 1
          }
          echo "CLI --version: OK"
          echo "::endgroup::"

      - name: Post marketplace metadata to release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          echo "::group::Appending marketplace metadata to release notes"
          python - <<'PYEOF'
          import os, subprocess

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]

          current = subprocess.run(
              ["gh", "api", "repos/" + repo + "/releases/tags/" + tag,
               "--jq", ".body"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          appendix = "\n\n---\n\n## \U0001F6D2 GitHub Actions Marketplace\n\nThis release publishes the **reimagine-it Design Health** action to the GitHub Actions marketplace.\n\n### Quick start\n\n```yaml\n- uses: Kayforkind/reimagine-it@" + tag + "\n  with:\n    path: \"**/*.html\"\n```\n\n### What it checks\n\n| Category | Checks |\n|----------|--------|\n| Typography | Hierarchy levels, text measure, banned default fonts |\n| Palette | Off-palette accents, unstyled ::selection, transition:all |\n| Motion | Missing prefers-reduced-motion, missing :focus-visible, non-compositor animation |\n| Content | Placeholder copy, vibe adjectives, emoji farm |\n| Structure | CDN / external font fetch, figure system |\n| Performance | Image dimensions, content-visibility |\n\n19 deterministic rules. No LLM. No API key."

          subprocess.run(
              ["gh", "release", "edit", tag, "--notes", current + appendix],
              check=True,
          )
          print("Release notes updated with marketplace metadata")
          PYEOF
          echo "::endgroup::"