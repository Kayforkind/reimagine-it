name: Release Benchmark

# The engine/CLI release pipeline. On every published release it:
#   1. runs the 15-token benchmark and appends the measured-quality table
#      to the release notes;
#   2. regenerates the token-board PNGs/GIFs from the current engine and
#      commits them back (only when they actually changed);
#   3. publishes the npm package.
#
# No push loop: this workflow triggers on `release: published`, not on push,
# and the commit-back only touches docs/ assets that no other workflow keys on.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run 15-token benchmark
        run: |
          echo "::group::Benchmarking all 15 directions × 4 sources"
          node scripts/benchmark-tokens.js 2>&1 | tee /tmp/benchmark.log
          echo "::endgroup::"

      - name: Append benchmark table to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::group::Appending benchmark results to release notes"
          python - <<'PYEOF'
          import os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]

          table = open("benchmark/BENCHMARK.md", encoding="utf-8").read()
          # Keep only the table + diversity/coverage lines (drop the intro/regenerate line).
          lines = [l for l in table.splitlines() if l.startswith("|") or l.startswith("**")]
          appendix = "\n\n---\n\n## 📊 Measured quality (auto-generated)\n\n" + "\n".join(lines) + "\n"

          current = subprocess.run(
              ["gh", "api", "repos/" + repo + "/releases/tags/" + tag, "--jq", ".body"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          subprocess.run(
              ["gh", "release", "edit", tag, "--notes", current + appendix],
              check=True,
          )
          print("Release notes updated with benchmark table")
          PYEOF
          echo "::endgroup::"

  token-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate token boards
        env:
          REIMAGINE_BROWSER: /usr/bin/google-chrome
        run: |
          echo "::group::Regenerating token boards from current engine"
          python -m pip install --quiet pillow
          python scripts/build-token-board.py
          echo "::endgroup::"

      - name: Commit token boards only when changed
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "::group::Checking for token-board changes"
          # Guard: skip the commit entirely when the engine output is unchanged.
          if git diff --quiet -- docs/tokens-board.png docs/tokens-phone.png docs/tokens/; then
            echo "No token-board changes — nothing to commit"
          else
            git add docs/tokens-board.png docs/tokens-phone.png docs/tokens/
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "docs: regenerate token boards for ${TAG}"
            git push origin HEAD:"$GITHUB_REF_NAME"
            echo "Token boards committed and pushed"
          fi
          echo "::endgroup::"

  publish-npm:
    # The npm package publishes from this workflow; publish-action.yml now
    # handles only the Design Health marketplace action, so there is exactly
    # one npm publisher per release.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Report skipped npm publication
        if: env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not configured; npm publication was skipped."
