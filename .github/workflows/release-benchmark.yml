      - name: Commit token boards only when changed
        env:
          TAG: ${{ github.event.release.tag_name || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::group::Checking for token-board changes"
          # Guard: skip entirely when the engine output is unchanged.
          if git diff --quiet -- docs/tokens-board.png docs/tokens-phone.png docs/tokens/; then
            echo "No token-board changes — nothing to commit"
          else
            git add docs/tokens-board.png docs/tokens-phone.png docs/tokens/
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "docs: regenerate token boards for ${TAG}"
            # main is admin-protected: a bot push would be rejected, so the
            # boards land through a PR that the required checks gate.
            BRANCH="boards/${TAG}-$(date +%s)"
            git push origin "HEAD:refs/heads/${BRANCH}"
            gh pr create --head "${BRANCH}" --base main \
              --title "docs: regenerate token boards for ${TAG}" \
              --body "Automated board refresh by the release pipeline (bot pushes to main are blocked by design). Merge to sync the committed stills with the released engine."
            gh pr merge --auto --merge
            echo "Token boards PR opened with auto-merge"
          fi
          echo "::endgroup::"

  publish-npm:
    # The npm package publishes from this workflow; publish-action.yml now
    # handles only the Design Health marketplace action, so there is exactly
    # one npm publisher per release.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # npm provenance — signed, verifiable build origin
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Guard the tarball against files-list drift
        run: node scripts/check-tarball.js

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "reimagine-it@${VERSION}" version >/dev/null 2>&1; then
            echo "reimagine-it@${VERSION} already published — skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Report skipped npm publication
        if: env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not configured; npm publication was skipped."

  sign-release:
    # Sigstore-sign the tarball and attach it to the GitHub release, so
    # clients can verify provenance both ways: npm attestation + cosign.
    needs: publish-npm
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the .tgz + .sig to the release
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Pack the exact published artifact
        run: |
          mkdir -p dist
          npm run build:docs --if-present
          npm pack --pack-destination dist
          echo "TARBALL=$(ls dist/*.tgz)" >> "$GITHUB_ENV"

      - name: Sign the tarball (keyless, bundle written next to it)
        run: cosign sign-blob --yes --bundle "${TARBALL}.sig" "$TARBALL"

      - name: Attach tarball + signature to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$TARBALL" "${TARBALL}.sig"
