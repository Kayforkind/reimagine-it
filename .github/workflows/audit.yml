name: Audit Gold Quality

permissions:
  contents: read

on:
  push:
    paths:
      - "gold/**/*.html"
      - "scripts/audit.py"
      - "scripts/audit_all.py"
      - "test/fixtures/**"
      - ".github/workflows/audit.yml"
      - "src/generate.js"
      - "src/audit.js"
      - "src/lock.js"
      - "src/variations.js"
      - "bin/reimagine-it.js"
      - "scripts/audit-tokens.js"
      - "scripts/render-audit.js"
  pull_request:
    paths:
      - "gold/**/*.html"
      - "scripts/audit.py"
      - "scripts/audit_all.py"
      - "test/fixtures/**"
      - "src/generate.js"
      - "src/audit.js"
      - "src/lock.js"
      - "src/variations.js"
      - "bin/reimagine-it.js"
      - "scripts/audit-tokens.js"
      - "scripts/render-audit.js"
  workflow_dispatch:

jobs:
  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Assert case tables match manifest ground truth
        run: |
          echo "## Docs-drift check (case tables vs manifest.json)" >> $GITHUB_STEP_SUMMARY
          python scripts/sync-case-docs.py
          if ! git diff --exit-code -- examples/end-users/README.md docs/CASE_STUDIES.md; then
            echo "::error::Case tables drifted from manifest.json + auto.json — run \`python scripts/sync-case-docs.py\` and commit the result"
            git diff -- examples/end-users/README.md docs/CASE_STUDIES.md >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Case tables match manifest ground truth" >> $GITHUB_STEP_SUMMARY

  audit-gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Audit all gold HTML files
        run: |
          echo "## Gold Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run the full sweep — same as `npm test` locally.
          # audit_all.py uses the same find_gold_html() as the CI,
          # writes per-file results to stdout, and exits non-zero on failures.
          # Guard against `set -e` aborting on warnings/failures, then
          # capture audit_all.py's true exit via PIPESTATUS[0] (not tee's).
          set +e
          python scripts/audit_all.py 2>&1 | tee audit.log
          EXIT=${PIPESTATUS[0]}
          set -e
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Audited with [reimagine-it](https://github.com/Kayforkind/reimagine-it) — [Content-Derived Design](https://kayforkind.github.io/reimagine-it/)" >> $GITHUB_STEP_SUMMARY
          
          # Exit codes: 0 = clean, 1 = warnings only, 2 = failures
          if [ "$EXIT" -ge 2 ]; then
            echo "::error::Gold audit has craft-floor failures — see step summary"
            exit 1
          fi
          
          if [ "$EXIT" -eq 1 ]; then
            echo "::warning::Gold audit has warnings only — no blockers"
          fi
          
          echo "Audit pass: exit code $EXIT"

  regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Assert audit catches failures
        run: |
          echo "## Regression test: audit.py must exit 2 on failing fixture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          set +e
          python scripts/audit.py test/fixtures/failing-craft-floor.html --json > /tmp/audit-result.json 2>&1
          EXIT=$?
          set -e
          if [ "$EXIT" -ne 2 ]; then
            echo "::error::audit.py should exit 2 on failing fixture, got $EXIT"
            cat /tmp/audit-result.json
            exit 1
          fi
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/audit-result.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ audit.py correctly exits 2 on failing fixture" >> $GITHUB_STEP_SUMMARY

  token-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Structural token audit
        run: |
          echo "## Token structural audit (15 tokens)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node scripts/audit-tokens.js 2>&1 | tee /tmp/token-audit.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -1 /tmp/token-audit.log

      - name: Headless render audit
        run: |
          echo "## Token render audit (15 tokens, Chrome headless)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node scripts/render-audit.js 2>&1 | tee /tmp/render-audit.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -1 /tmp/render-audit.log

  proof-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Pillow for the asset builders
        run: python -m pip install --quiet pillow

      - name: Assert committed proof assets match their regenerators
        run: |
          echo "## Proof-asset drift check (manifest, case tables, Pages assets)" >> $GITHUB_STEP_SUMMARY
          # Deterministic, browser-free regenerators: if any of these produce
          # a diff, the committed proof no longer matches the committed engine.
          python scripts/sync-case-docs.py
          python scripts/sync-pages-assets.py
          node -e "
            const fs = require('fs');
            const { extractContent } = require('./src/extract');
            const { autoGenerate } = require('./src/auto');
            const manifest = JSON.parse(fs.readFileSync('examples/end-users/manifest.json', 'utf8'));
            for (const ex of manifest.examples) {
              const html = fs.readFileSync(ex.source, 'utf8');
              const content = extractContent(html, ex.source);
              const result = autoGenerate(content, { seed: ex.seed });
              if (result.token !== ex.auto_token) {
                console.error('drift: ' + ex.source + ' auto picked ' + result.token + ' but manifest records ' + ex.auto_token);
                process.exit(1);
              }
              const report = JSON.parse(fs.readFileSync(ex.report, 'utf8'));
              if (result.score !== report.score) {
                console.error('drift: ' + ex.report + ' score ' + report.score + ' but engine now produces ' + result.score);
                process.exit(1);
              }
            }
            console.log('manifest matches engine: ' + manifest.examples.length + ' examples');
          "
          if ! git diff --exit-code -- examples/end-users/README.md docs/CASE_STUDIES.md examples docs; then
            echo "::error::Proof assets drifted from the engine — run 'npm run examples' and commit the result"
            git diff --stat -- examples docs >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Manifest, tables, and Pages assets match ground truth" >> $GITHUB_STEP_SUMMARY