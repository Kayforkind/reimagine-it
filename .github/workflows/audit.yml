name: Audit Gold Quality

on:
  push:
    paths:
      - "gold/**/*.html"
      - "scripts/audit.py"
      - "scripts/audit_all.py"
      - "test/fixtures/**"
      - ".github/workflows/audit.yml"
      - "src/generate.js"
      - "scripts/audit-tokens.js"
      - "scripts/render-audit.js"
      - "scripts/benchmark-tokens.js"
      - "src/extract.js"
      - "bin/reimagine-it.js"
  pull_request:
    paths:
      - "gold/**/*.html"
      - "scripts/audit.py"
      - "scripts/audit_all.py"
      - "test/fixtures/**"
      - "src/generate.js"
      - "scripts/audit-tokens.js"
      - "scripts/render-audit.js"
      - "scripts/benchmark-tokens.js"
      - "src/extract.js"
      - "bin/reimagine-it.js"
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC — enforce the 100/100 bar over time
  workflow_dispatch:

jobs:
  audit-gold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit all gold HTML files
        run: |
          echo "## Gold Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run the full sweep — same as `npm test` locally.
          # audit_all.py uses the same find_gold_html() as the CI,
          # writes per-file results to stdout, and exits non-zero on failures.
          # Guard against `set -e` aborting on warnings/failures, then
          # capture audit_all.py's true exit via PIPESTATUS[0] (not tee's).
          set +e
          python scripts/audit_all.py 2>&1 | tee audit.log
          EXIT=${PIPESTATUS[0]}
          set -e
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Audited with [reimagine-it](https://github.com/Kayforkind/reimagine-it) — [Content-Derived Design](https://kayforkind.github.io/reimagine-it/)" >> $GITHUB_STEP_SUMMARY
          
          # Exit codes: 0 = clean, 1 = warnings only, 2 = failures
          if [ "$EXIT" -ge 2 ]; then
            echo "::error::Gold audit has craft-floor failures — see step summary"
            exit 1
          fi
          
          if [ "$EXIT" -eq 1 ]; then
            echo "::warning::Gold audit has warnings only — no blockers"
          fi
          
          echo "Audit pass: exit code $EXIT"

  regression-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert audit catches failures
        run: |
          echo "## Regression test: audit.py must exit 2 on failing fixture" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          set +e
          python scripts/audit.py test/fixtures/failing-craft-floor.html --json > /tmp/audit-result.json 2>&1
          EXIT=$?
          set -e
          if [ "$EXIT" -ne 2 ]; then
            echo "::error::audit.py should exit 2 on failing fixture, got $EXIT"
            cat /tmp/audit-result.json
            exit 1
          fi
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/audit-result.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ audit.py correctly exits 2 on failing fixture" >> $GITHUB_STEP_SUMMARY

  token-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Structural token audit
        run: |
          echo "## Token structural audit (14 tokens)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node scripts/audit-tokens.js 2>&1 | tee /tmp/token-audit.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -1 /tmp/token-audit.log

      - name: Headless render audit
        run: |
          echo "## Token render audit (14 tokens, Chrome headless)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node scripts/render-audit.js 2>&1 | tee /tmp/render-audit.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -1 /tmp/render-audit.log

  token-benchmark-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Benchmark 15 tokens (100/100 quality gate)
        run: |
          echo "## Token benchmark gate (15 directions × 4 sources)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node scripts/benchmark-tokens.js --gate 2>&1 | tee /tmp/benchmark-gate.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -2 /tmp/benchmark-gate.log