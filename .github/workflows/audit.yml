name: Audit Gold Quality

on:
  push:
    paths:
      - "gold/**/*.html"
      - "scripts/audit.py"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "gold/**/*.html"
      - "scripts/audit.py"
  workflow_dispatch:

jobs:
  audit-gold:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit all gold HTML files
        run: |
          echo "## Gold Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PASS=0
          FAIL=0
          WARN=0
          BLOCKED=""

          echo "| File | Verdict | Failures | Warnings |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---------|----------|----------|" >> $GITHUB_STEP_SUMMARY

          for f in $(find gold -name '*.html' -not -path '*/vendor/*' -not -path '*/loops/*' -not -path '*/_preview*/*' -not -name 'before.html' -not -name 'see.html' | sort); do
            RESULT=$(python scripts/audit.py "$f" --json 2>&1 || true)
            VERDICT=$(echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('verdict','FAIL'))" 2>/dev/null || echo "ERROR")
            FCOUNT=$(echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('failures',99))" 2>/dev/null || echo "99")
            WCOUNT=$(echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('warnings',99))" 2>/dev/null || echo "99")

            case "$VERDICT" in
              CLEAN)
                echo "| \`$f\` | ✅ Clean | — | — |" >> $GITHUB_STEP_SUMMARY
                PASS=$((PASS + 1))
                ;;
              WARNINGS)
                echo "| \`$f\` | ⚠️ Warnings | — | $WCOUNT |" >> $GITHUB_STEP_SUMMARY
                WARN=$((WARN + 1))
                ;;
              FAIL|ERROR)
                echo "| \`$f\` | ❌ $VERDICT | $FCOUNT | $WCOUNT |" >> $GITHUB_STEP_SUMMARY
                FAIL=$((FAIL + 1))
                BLOCKED="$BLOCKED $f"
                ;;
            esac
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary:** $PASS clean · $WARN warnings · $FAIL failures" >> $GITHUB_STEP_SUMMARY

          if [ -n "$BLOCKED" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚫 **Blocked files:** $BLOCKED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$FAIL" -gt 0 ]; then
            echo "::error::$FAIL gold file(s) have audit failures — see step summary for details"
            exit 1
          fi

          echo "All gold files pass: $PASS clean, $WARN warnings"