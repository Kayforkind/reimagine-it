name: review-gold

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Plugin manifests agree
        run: python scripts/verify_plugin_package.py
      - name: Gold review
        run: python scripts/review_gold.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
      - name: Run cross-platform test suite
        run: npm test
      - name: Check JavaScript entrypoints
        run: |
          node --check bin/reimagine-it.js
          node --check src/extract.js
          node --check src/generate.js
          node --check src/audit.js
          node --check src/lock.js
          node --check src/variations.js
          node --check mcp/server.js
          node --check mcp/tools.js
          node --check extension/popup.js
      - name: Validate package contents
        run: |
          node -e "
          const { execSync } = require('child_process');
          const raw = execSync('npm pack --dry-run --json', { encoding: 'utf8' });
          const parsed = JSON.parse(raw);
          const entry = Array.isArray(parsed) ? parsed[0] : parsed;
          const files = (entry.files || []).map((f) => String(f.path || f).replace(/\\\\/g, '/'));
          const need = ['mcp/tools.js', 'mcp/server.js', 'src/lock.js', 'src/variations.js', 'src/audit.js', 'bin/reimagine-it.js'];
          const missing = need.filter((n) => !files.includes(n));
          if (missing.length) {
            console.error('npm pack is missing:', missing.join(', '));
            process.exit(1);
          }
          console.log('npm pack includes engine + MCP tools (' + files.length + ' files)');
          "

