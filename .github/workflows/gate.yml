name: CI Gate

# The one required check for main. Runs the whole battery a release runs:
# gold audit, engine + MCP + fuzz units, e2e CLI, bundle freshness, tarball
# guard, stills guard, reproduction guard, and audit parity. External PRs
# cannot merge without this passing plus the owner's review (CODEOWNERS).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.x"

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Full suite (audit, units, fuzz, e2e, all guards)
        run: npm test

      - name: Token benchmark gate (every token 100/100)
        run: node scripts/benchmark-tokens.js
