name: CI Gate

# The one required check for main. Runs the whole battery a release runs:
# gold audit, engine + MCP + fuzz units, e2e CLI, bundle freshness, tarball
# guard, stills guard, reproduction guard, and audit parity. External PRs
# cannot merge without this passing plus the owner's review (CODEOWNERS).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  battery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.x"

      # --ignore-scripts: a PR can edit package.json, so never let its
      # lifecycle scripts execute on our runners. Tests do not need them.
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Full suite (audit, units, fuzz, e2e, all guards)
        run: npm test

      - name: Token benchmark gate (every token 100/100)
        run: node scripts/benchmark-tokens.js
