<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reimagine This Page</title>
<style>
  :root {
    --paper: #f4ecd8; --ink: #1a2138; --dim: #6a624e;
    --hot: #b22234; --gold: #e8a63f; --void: #0a1626;
    --serif: "Iowan Old Style", Palatino, Georgia, serif;
    --sans: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 380px; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .header { padding: 16px 20px 12px; border-bottom: 1px solid rgba(26,33,56,.1); }
  .header .brand { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
  .header h1 { font-family: var(--serif); font-weight: 400; font-size: 18px; margin-top: 4px; color: var(--hot); }
  .content { padding: 16px 20px 20px; }
  .extract-info { background: var(--void); color: var(--paper); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; font-size: 12px; line-height: 1.7; }
  .extract-info .label { color: var(--gold); font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .extract-info .val { color: var(--paper); }
  .token-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .token-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(26,33,56,.18);
    background: transparent; color: var(--dim); cursor: pointer;
    transition: background-color .12s ease-out, color .12s ease-out, border-color .12s ease-out; text-align: center;
  }
  .token-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .token-btn.active { background: var(--hot); color: var(--paper); border-color: var(--hot); }
  .run-btn {
    width: 100%; font-family: var(--sans); font-size: 14px; font-weight: 600;
    padding: 12px; border: 0; border-radius: 8px;
    background: var(--ink); color: var(--paper); cursor: pointer;
    transition: transform .12s ease-out;
  }
  .run-btn:hover { transform: translateY(-1px); }
  .run-btn:disabled { opacity: .4; cursor: default; transform: none; }
  .footer { padding: 0 20px 16px; font-size: 11px; color: var(--dim); }
  .footer a { color: var(--hot); text-decoration: none; }
  ::selection { background: var(--gold); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
  <div class="header">
    <span class="brand">Content-Derived Design</span>
    <h1>Reimagine This Page</h1>
  </div>
  <div class="content">
    <div class="extract-info" id="extractInfo">
      <div class="label">Reading page…</div>
    </div>
    <div class="token-grid" id="tokenGrid">
      <button class="token-btn active" data-token="webpage">webpage</button>
      <button class="token-btn" data-token="auto">auto · choose for me</button>
      <button class="token-btn" data-token="infographic">infographic</button>
      <button class="token-btn" data-token="dashboard">dashboard</button>
      <button class="token-btn" data-token="artistic">artistic</button>
      <button class="token-btn" data-token="cinematic">cinematic</button>
      <button class="token-btn" data-token="landing">landing</button>
      <button class="token-btn" data-token="svg">svg</button>
      <button class="token-btn" data-token="photography">photography</button>
      <button class="token-btn" data-token="simulation">simulation</button>
      <button class="token-btn" data-token="3js">3js</button>
    </div>
    <button class="run-btn" id="runBtn">Reimagine →</button>
  </div>
  <div class="footer">
    <a href="https://github.com/Kayforkind/reimagine-it" target="_blank">reimagine-it</a> · <a href="https://kayforkind.github.io/reimagine-it/" target="_blank">playground</a> · MIT
  </div>
<script src="engine.js"></script>
<script src="popup.js"></script>
</body>
</html>
