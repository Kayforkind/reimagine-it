<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img"
     aria-label="How /reimagine-it decides: context, adjacent possible, four notes, form, artifact.">
  <title>How /reimagine-it decides</title>
  <desc>Left to right: context sniff, adjacent possible plus one SCAMPER letter, four private notes, hero form router, shipped artifact plus stretch.</desc>

  <rect width="960" height="260" fill="#0c0e12"/>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="13" fill="#e8edf4">
    <g>
      <rect x="24" y="80" width="160" height="100" rx="10" fill="#12352c" stroke="#1e5c4d"/>
      <text x="104" y="112" text-anchor="middle" fill="#7ee0c0" font-size="11" letter-spacing="2">CONTEXT</text>
      <text x="104" y="138" text-anchor="middle">repo, README</text>
      <text x="104" y="156" text-anchor="middle">issues, thread</text>
      <text x="104" y="174" text-anchor="middle" fill="#8b97a4" font-size="11">(no interview by default)</text>
    </g>

    <g>
      <rect x="204" y="80" width="170" height="100" rx="10" fill="#171c24" stroke="#2a3340"/>
      <text x="289" y="112" text-anchor="middle" fill="#7ee0c0" font-size="11" letter-spacing="2">ADJACENT POSSIBLE</text>
      <text x="289" y="138" text-anchor="middle">unused combination</text>
      <text x="289" y="156" text-anchor="middle">of parts already here</text>
      <text x="289" y="174" text-anchor="middle" fill="#8b97a4" font-size="11">plus one SCAMPER letter</text>
    </g>

    <g>
      <rect x="394" y="80" width="160" height="100" rx="10" fill="#171c24" stroke="#2a3340"/>
      <text x="474" y="112" text-anchor="middle" fill="#7ee0c0" font-size="11" letter-spacing="2">FOUR NOTES</text>
      <text x="474" y="138" text-anchor="middle">device, leap</text>
      <text x="474" y="156" text-anchor="middle">craft, effect</text>
      <text x="474" y="174" text-anchor="middle" fill="#8b97a4" font-size="11">(private, no mood words)</text>
    </g>

    <g>
      <rect x="574" y="80" width="180" height="100" rx="10" fill="#171c24" stroke="#2a3340"/>
      <text x="664" y="112" text-anchor="middle" fill="#7ee0c0" font-size="11" letter-spacing="2">FORM ROUTER</text>
      <text x="664" y="138" text-anchor="middle">code, cli, protocol</text>
      <text x="664" y="156" text-anchor="middle">demo, prose, svg, html</text>
      <text x="664" y="174" text-anchor="middle" fill="#8b97a4" font-size="11">visuals are one form</text>
    </g>

    <g>
      <rect x="774" y="80" width="160" height="100" rx="10" fill="#12352c" stroke="#1e5c4d"/>
      <text x="854" y="112" text-anchor="middle" fill="#7ee0c0" font-size="11" letter-spacing="2">ARTIFACT</text>
      <text x="854" y="138" text-anchor="middle">runnable, openable</text>
      <text x="854" y="156" text-anchor="middle">keepable, exits 0</text>
      <text x="854" y="174" text-anchor="middle" fill="#8b97a4" font-size="11">plus one stretch named</text>
    </g>

    <g stroke="#7ee0c0" stroke-width="2" fill="none">
      <path d="M 184 130 L 204 130"/>
      <path d="M 374 130 L 394 130"/>
      <path d="M 554 130 L 574 130"/>
      <path d="M 754 130 L 774 130"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
    <text x="24" y="46" fill="#8b97a4" font-size="11" letter-spacing="2.4">HOW /reimagine-it DECIDES</text>
    <text x="24" y="228" fill="#e8edf4" font-size="12">
      No brainstorm list. No "wow factor." One artifact this workspace can actually hold.
    </text>
    <text x="24" y="248" fill="#8b97a4" font-size="11">
      /reimagine-it is the same chair with an elevation and Tuesday-handle default.
    </text>
  </g>
</svg>
