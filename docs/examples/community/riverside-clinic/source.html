<h1>Riverside Community Clinic — Walk-in Bulletin</h1>
<p>Walk-in care on the river side of Delmore Avenue. The bulletin board at the entrance is sand #F5EFE4 with a teal #0F766E header rail, rust #B4532A pushpins, and ink #22303A lettering — the same palette the print edition uses.</p>

<h2>This week's hours</h2>
<p>The walk-in desk opens 8 AM to 7 PM on weekdays and 9 AM to 1 PM on Saturdays. The phone line answers from 7:30 AM. Closed Sunday, and closed the morning of October 12, 2026 for staff training, reopening at 1 PM.</p>

<h2>Flu clinic dates</h2>
<ul>
  <li>September 22, 2026 — first walk-in flu clinic, 500 doses on hand</li>
  <li>October 6, 2026 — second clinic; the first drew 380 people</li>
  <li>October 20, 2026 — evening clinic until 8 PM for shift workers</li>
  <li>November 3, 2026 — last scheduled clinic before the holidays</li>
</ul>

<h2>Compare last season</h2>
<p>Compare the 2025 season with this season's plan: 2025 gave 2,850 flu shots across four clinics; 2026 schedules six clinics and stocks 4,000 doses. Average wait fell from 34 minutes to 21 minutes after the desk moved to the atrium.</p>

<h2>Services and fees</h2>
<ul>
  <li>Walk-in visit — 45 dollars uninsured, covered by county card</li>
  <li>Blood pressure check — free, no appointment</li>
  <li>Child vaccination — 12 dollars per dose, sliding scale</li>
  <li>Prescription refill pickup — 6 dollars</li>
</ul>

<h2>Find us</h2>
<p>18 Delmore Avenue, by the river footbridge. Bus 14 and bus 31 stop at the door. Questions to <a href="mailto:frontdesk@riversideclinic.example">frontdesk@riversideclinic.example</a> — the survey box by the mailto desk collected 1,140 comments last year.</p>
