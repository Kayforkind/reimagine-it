name: "reimagine-it Design Health"
description: "19 deterministic design-quality checks for HTML. No LLM, no API key. Catches blank plates, missing focus rings, non-compositor motion, un-styled selection, palette drift, and more. Use in CI to gate deploys on design quality."
author: "Kayforkind"
branding:
  icon: "check-circle"
  color: "yellow"

inputs:
  path:
    description: "Glob pattern for HTML files to audit"
    required: false
    default: "**/*.html"
  fail-on-warnings:
    description: "Exit 1 on warnings too (not just failures)"
    required: false
    default: "false"
  verbose:
    description: "Show per-category breakdown in logs"
    required: false
    default: "false"
  strict:
    description: "Exit 1 if NO HTML files matched the glob (catches misconfigured paths)"
    required: false
    default: "false"

outputs:
  verdict:
    description: "CLEAN | WARNINGS | FAIL"
    value: ${{ steps.audit.outputs.verdict }}
  failures:
    description: "Number of blocking failures"
    value: ${{ steps.audit.outputs.failures }}
  warnings:
    description: "Number of advisory warnings"
    value: ${{ steps.audit.outputs.warnings }}
  summary:
    description: "Markdown summary table for the workflow summary"
    value: ${{ steps.audit.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        echo "::group::Design Health — reimagine-it"
        echo "Path pattern: $INPUT_PATH"
        echo "Fail on warnings: $INPUT_FAIL_ON_WARNINGS"
        echo "Verbose: $INPUT_VERBOSE"

    - name: Run audit
      id: audit
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON_WARNINGS: ${{ inputs.fail-on-warnings }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_STRICT: ${{ inputs.strict }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        set -e
        VERBOSE_FLAG=""
        if [ "$INPUT_VERBOSE" = "true" ]; then
          VERBOSE_FLAG="--verbose"
        fi

        TOTAL=0
        PASS=0
        WARN=0
        FAIL=0
        OVERALL="CLEAN"
        FAIL_ON_WARN="$INPUT_FAIL_ON_WARNINGS"
        STRICT="$INPUT_STRICT"

        # Build summary table header
        SUMMARY="| File | Verdict | Failures | Warnings |\n|------|---------|----------|----------|\n"
        shopt -s nullglob globstar

        for f in $INPUT_PATH; do
          # Skip dirs, non-existent files, vendored paths
          [ ! -f "$f" ] && continue
          case "$f" in *vendor/*|*node_modules/*|*.min.html) continue ;; esac
          case "$f" in *.html) ;; *) continue ;; esac

          TOTAL=$((TOTAL + 1))
          RESULT=$(python "$GITHUB_ACTION_PATH/scripts/audit.py" "$f" --json $VERBOSE_FLAG 2>&1) || true
          VERDICT=$(echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('verdict','FAIL'))" 2>/dev/null || echo "ERROR")
          FCOUNT=$(echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('failures',99))" 2>/dev/null || echo "99")
          WCOUNT=$(echo "$RESULT" | python -c "import sys,json; d=json.load(sys.stdin); print(d.get('warnings',99))" 2>/dev/null || echo "99")

          case "$VERDICT" in
            CLEAN)
              SUMMARY+="| \`$f\` | ✅ Clean | — | — |\n"
              PASS=$((PASS + 1))
              ;;
            WARNINGS)
              SUMMARY+="| \`$f\` | ⚠️ Warnings | — | $WCOUNT |\n"
              WARN=$((WARN + 1))
              if [ "$OVERALL" = "CLEAN" ]; then OVERALL="WARNINGS"; fi
              ;;
            *)
              SUMMARY+="| \`$f\` | ❌ $VERDICT | $FCOUNT | $WCOUNT |\n"
              FAIL=$((FAIL + 1))
              OVERALL="FAIL"
              ;;
          esac
        done

        # Strict mode: fail if no files matched
        if [ "$TOTAL" -eq 0 ]; then
          if [ "$STRICT" = "true" ]; then
            echo "::error::No HTML files matched path '${{ inputs.path }}' (strict mode enabled)"
            exit 1
          fi
          echo "::warning::No HTML files matched path '${{ inputs.path }}'"
          SUMMARY+="\n_(no files matched)_"
        fi

        SUMMARY+="\n**Design Health:** $PASS clean · $WARN warnings · $FAIL failures  \n"
        SUMMARY+="[reimagine-it](https://github.com/${{ github.action_repository }}) | "
        SUMMARY+="[Content-Derived Design](https://kayforkind.github.io/reimagine-it/) | "
        SUMMARY+="[19 rules](https://github.com/${{ github.action_repository }}/blob/main/scripts/audit.py)"

        if [ "$TOTAL" -eq 0 ]; then OVERALL="WARNINGS"; fi
        echo "verdict=$OVERALL" >> $GITHUB_OUTPUT
        echo "failures=$FAIL" >> $GITHUB_OUTPUT
        echo "warnings=$WARN" >> $GITHUB_OUTPUT

        {
          echo "summary<<EOF"
          echo -e "$SUMMARY"
          echo "EOF"
        } >> $GITHUB_OUTPUT

        echo -e "$SUMMARY" >> $GITHUB_STEP_SUMMARY

        if [ "$FAIL" -gt 0 ]; then
          echo "::error::$FAIL file(s) have design-health failures — see summary above."
          exit 1
        fi

        if [ "$WARN" -gt 0 ] && [ "$FAIL_ON_WARN" = "true" ]; then
          echo "::error::$WARN file(s) have design warnings. Failing because fail-on-warnings is enabled."
          exit 1
        fi

        if [ "$WARN" -gt 0 ]; then
          echo "::warning::$WARN file(s) have design warnings. Review the step summary."
        fi

        echo "✅ Design Health passed — $PASS clean, $WARN warnings"
        echo "::endgroup::"